name: Draw ZMK keymaps

on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "keymap_drawer.config.yaml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/*.keymap"
      config_path: "keymap_drawer.config.yaml"
      # cygnus3x5_xiao / cygnus_xiao are custom out-of-tree shields, so
      # they aren't in keymap-drawer's known-keyboard database. Reuse
      # matching physical layouts instead:
      #   cygnus3x5_xiao -> QMK crkbd LAYOUT_split_3x5_3
      #   cygnus_xiao    -> ZMK corne (3x6+3)
      # (-k/-l/-z are `keymap draw` options, not `keymap parse` ones).
      #
      # No space after the colon, and each value quoted since it
      # contains a space - the reusable workflow's own arg parser
      # word-splits on whitespace otherwise and silently drops it.
      # All entries must stay on ONE line: the parser runs them through
      # `eval set --`, so a newline ends the command and every entry
      # after the first line is silently ignored.
      draw_args: "cygnus3x5_xiao:'-k crkbd/rev1 -l LAYOUT_split_3x5_3' cygnus_xiao:'-z corne'"
