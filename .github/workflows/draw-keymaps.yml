name: Draw ZMK keymaps

on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "keymap_drawer.config.yaml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/*.keymap"
      config_path: "keymap_drawer.config.yaml"
      # cygnus3x5_xiao is a custom out-of-tree shield, so it isn't in
      # keymap-drawer's known-keyboard database. It's physically the
      # same 3x5+3 layout as the Corne 5-column variant, so reuse the
      # QMK crkbd LAYOUT_split_3x5_3 physical layout when drawing
      # (-k/-l are `keymap draw` options, not `keymap parse` ones).
      #
      # No space after the colon, and the value quoted since it
      # contains a space - the reusable workflow's own arg parser
      # word-splits on whitespace otherwise and silently drops it.
      draw_args: |
        cygnus3x5_xiao:'-k crkbd/rev1 -l LAYOUT_split_3x5_3'
